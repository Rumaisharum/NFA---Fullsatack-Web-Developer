<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Study Resources</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            padding: 25px 20px;
            color: #fff;
        }
        h3 {
            font-size: 20px;
            margin-bottom: 25px;
            color: #fff;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            padding-bottom: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        fieldset {
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 20px;
            background: rgba(255,255,255,0.02);
        }
        legend {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            padding: 0 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        ul {
            list-style: none;
        }
        li {
            margin: 15px 0;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            border-left: 3px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
        }
        li:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(5px);
            border-left-color: #fff;
        }
        a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            font-size: 13px;
            display: block;
            font-weight: 500;
        }
        a:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <h3>📚 Study Resources</h3>
    <fieldset>
        <legend>Learning Materials</legend>
        <ul>
            <li><a href="https://www.w3schools.com/html/" target="_blank"> W3Schools - HTML Tutorial</a></li>
            <li><a href="https://www.w3schools.com/css/" target="_blank"> W3Schools - CSS Tutorial</a></li>
            <li><a href="https://www.w3schools.com/js/" target="_blank">⚡ W3Schools - JavaScript Tutorial</a></li>
            <li><a href="https://laravel.com/docs" target="_blank"> Laravel Documentation</a></li>
            <li><a href="https://www.mysql.com/doc/" target="_blank">🗄️ MySQL Documentation</a></li>
        </ul>
    </fieldset>
</body>
</html>
