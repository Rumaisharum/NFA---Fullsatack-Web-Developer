<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Menu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 25px;
            padding: 0 20px;
        }
        .menu-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, rgba(138,43,226,0.9), rgba(147,112,219,0.7));
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.2);
            letter-spacing: 0.5px;
        }
        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(138,43,226,0.6);
            background: linear-gradient(135deg, rgba(138,43,226,1), rgba(147,112,219,0.9));
        }
    </style>
</head>
<body>
    <a href="home.html" target="main" class="menu-btn">👤 EXO Members</a>
    <a href="history.html" target="main" class="menu-btn"> History </a>
</body>
</html>
