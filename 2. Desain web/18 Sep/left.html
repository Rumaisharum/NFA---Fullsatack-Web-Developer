<!DOCTYPE html>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            padding: 25px 20px;
            color: #fff;
            overflow: auto;
        }
        h3 {
            font-size: 20px;
            margin-bottom: 25px;
            color: #fff;
            padding-bottom: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        fieldset {
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 20px;
            background: rgba(255,255,255,0.02);
        }
        legend {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            padding: 0 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        ul {
            list-style: none;
        }
        li {
            margin: 10px 0;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            transition: all 0.3s;
        }
        li:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(5px);
        }
        a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            font-size: 13px;
            display: block;
            font-weight: 500;
        }
        a:hover {
            color: #fff;
        }
        .member-ig {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            margin-top: 3px;
        }
        .note {
            font-size: 10px;
            color: #8a2be2;
            font-style: italic;
            margin-top: 2px;
        }
    </style>
</head>
