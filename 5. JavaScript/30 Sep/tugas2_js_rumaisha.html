<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 2 JavaScript - Data Pegawai</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 3px solid #27ae60;
            padding-bottom: 10px;
        }
        .section {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            color: #27ae60;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        thead th {
            background: #27ae60;
            color: white;
        }
        tbody tr:nth-child(even) {
            background: #f9f9f9;
        }
        tfoot td {
            background: #e8f8f5;
            font-weight: bold;
            font-size: 1.1em;
        }
        .info {
            background: #e8f8f5;
            padding: 15px;
            border-left: 4px solid #27ae60;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1> Tugas 2 - Data Pegawai</h1>

    <div class="section">
        <h2>📋 Data Pegawai</h2>
        <div class="info">
            <p><strong>Nama Pegawai:</strong> Dodi</p>
            <p><strong>Umur:</strong> 25 tahun</p>
            <p><strong>Jabatan:</strong> Manajer</p>
            <p><strong>Status:</strong> Menikah</p>
        </div>
    </div>

    <div class="section">
        <h2>💵 Perhitungan Gaji</h2>
        <div id="output-tabel"></div>
    </div>

    <script>
        // TUGAS 2: DATA PEGAWAI DAN PERHITUNGAN GAJI
        // Menggunakan Variabel, If, Ternary Operator

        // Deklarasi variabel data pegawai
        let namaPegawai = "Dodi Prayodi";
        let umurPegawai = 25;
        let jabatanPegawai = "Manajer";
        let statusPegawai = "Menikah";

        // PERHITUNGAN GAJI POKOK MENGGUNAKAN IF
        // Aturan: Manajer => 15 jt, Asisten Manajer => 10 jt, Staff => 5 jt
        let gajiPokok;

        if (jabatanPegawai === "Manajer") {
            gajiPokok = 15000000;
        } else if (jabatanPegawai === "Asisten Manajer") {
            gajiPokok = 10000000;
        } else if (jabatanPegawai === "Staff") {
            gajiPokok = 5000000;
        } else {
            gajiPokok = 0;
        }

        // PERHITUNGAN TUNJANGAN JABATAN
        // Tunjangan Jabatan: 15% dari gaji pokok
        let tunjanganJabatan = gajiPokok * 0.15;

        // PERHITUNGAN BPJS
        // BPJS: 10% dari gaji pokok
        let bpjs = gajiPokok * 0.10;

        // PERHITUNGAN TUNJANGAN KELUARGA MENGGUNAKAN TERNARY
        // Status menikah => 20% dari gaji pokok
        let tunjanganKeluarga = (statusPegawai === "Menikah") ? (gajiPokok * 0.20) : 0;

        // PERHITUNGAN TOTAL GAJI
        // Total = Gaji Pokok + Tunjangan Jabatan + Tunjangan Keluarga - BPJS
        let totalGaji = gajiPokok + tunjanganJabatan + tunjanganKeluarga - bpjs;

        // MENAMPILKAN HASIL DALAM TABEL HTML
        document.getElementById('output-tabel').innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Komponen Gaji</th>
                        <th>Jumlah (Rp)</th>
                        <th>Keterangan</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>Gaji Pokok</strong></td>
                        <td>Rp ${gajiPokok.toLocaleString('id-ID')}</td>
                        <td>Jabatan: ${jabatanPegawai}</td>
                    </tr>
                    <tr>
                        <td>Tunjangan Jabatan</td>
                        <td>Rp ${tunjanganJabatan.toLocaleString('id-ID')}</td>
                        <td>15% dari gaji pokok</td>
                    </tr>
                    <tr>
                        <td>Tunjangan Keluarga</td>
                        <td>Rp ${tunjanganKeluarga.toLocaleString('id-ID')}</td>
                        <td>Status: ${statusPegawai} (20% dari gaji pokok)</td>
                    </tr>
                    <tr>
                        <td>BPJS</td>
                        <td>Rp ${bpjs.toLocaleString('id-ID')}</td>
                        <td>10% dari gaji pokok (potongan)</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td><strong>TOTAL GAJI</strong></td>
                        <td><strong>Rp ${totalGaji.toLocaleString('id-ID')}</strong></td>
                        <td>Gaji Pokok + Tunjangan - BPJS</td>
                    </tr>
                </tfoot>
            </table>
        `;

        // Menampilkan hasil di console browser (tekan F12 untuk melihat)
        console.log("=== TUGAS 2: DATA PEGAWAI ===");
        console.log("Nama:", namaPegawai);
        console.log("Umur:", umurPegawai, "tahun");
        console.log("Jabatan:", jabatanPegawai);
        console.log("Status:", statusPegawai);
        console.log("Gaji Pokok: Rp", gajiPokok.toLocaleString('id-ID'));
        console.log("Tunjangan Jabatan: Rp", tunjanganJabatan.toLocaleString('id-ID'));
        console.log("Tunjangan Keluarga: Rp", tunjanganKeluarga.toLocaleString('id-ID'));
        console.log("BPJS: Rp", bpjs.toLocaleString('id-ID'));
        console.log("Total Gaji: Rp", totalGaji.toLocaleString('id-ID'));
    </script>
</body>
</html>
