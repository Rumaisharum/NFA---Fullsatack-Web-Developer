<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 3 JavaScript - Sistem Manajemen Toko Online</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 3px solid #e67e22;
            padding-bottom: 10px;
        }
        .section {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            color: #e67e22;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #e67e22;
            color: white;
        }
        tr:hover {
            background: #fef5e7;
        }
        .success {
            color: #27ae60;
            font-weight: bold;
            padding: 10px;
            background: #d4edda;
            border-left: 4px solid #27ae60;
            margin: 10px 0;
        }
        .delete {
            color: #e74c3c;
            font-weight: bold;
            padding: 10px;
            background: #f8d7da;
            border-left: 4px solid #e74c3c;
            margin: 10px 0;
        }
        .info {
            background: #fef5e7;
            padding: 15px;
            border-left: 4px solid #e67e22;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🛒 Tugas 3 - Sistem Manajemen Toko Online</h1>
    <div id="output"></div>

    <script>
        // ============================================
        // TUGAS 3: SISTEM MANAJEMEN TOKO ONLINE
        // Menggunakan Array of Objects dan Function
        // ============================================

        // 1. Array produkToko yang menyimpan daftar produk
        let produkToko = [
            { id: 1, nama: "Laptop", harga: 7000000, stok: 5 },
            { id: 2, nama: "Mouse", harga: 200000, stok: 10 },
            { id: 3, nama: "Keyboard", harga: 350000, stok: 7 }
        ];

        // 2. Fungsi tambahProduk untuk menambahkan produk baru ke dalam array
        function tambahProduk(nama, harga, stok) {
            // Mencari ID baru (ID terakhir + 1)
            let idBaru = produkToko.length > 0 ? produkToko[produkToko.length - 1].id + 1 : 1;
            
            // Membuat objek produk baru
            let produkBaru = {
                id: idBaru,
                nama: nama,
                harga: harga,
                stok: stok
            };
            
            // Menambahkan produk ke array menggunakan method push()
            produkToko.push(produkBaru);
            
            return `✅ Produk "${nama}" berhasil ditambahkan dengan ID: ${idBaru}`;
        }

        // 3. Fungsi hapusProduk untuk menghapus produk berdasarkan id
        function hapusProduk(id) {
            // Mencari produk yang akan dihapus
            let produkDihapus = produkToko.find(p => p.id === id);
            
            if (produkDihapus) {
                // Menghapus produk menggunakan method filter()
                produkToko = produkToko.filter(p => p.id !== id);
                return `🗑️ Produk "${produkDihapus.nama}" (ID: ${id}) berhasil dihapus`;
            } else {
                return `❌ Produk dengan ID ${id} tidak ditemukan`;
            }
        }

        // 4. Fungsi tampilkanProduk untuk menampilkan daftar produk
        function tampilkanProduk() {
            // Cek apakah array kosong
            if (produkToko.length === 0) {
                return "<p>Tidak ada produk dalam toko.</p>";
            }

            // Membuat tabel HTML untuk menampilkan produk
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nama Produk</th>
                            <th>Harga (Rp)</th>
                            <th>Stok</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            // Looping menggunakan forEach untuk menampilkan setiap produk
            produkToko.forEach(function(item) {
                let hargaFormat = item.harga.toLocaleString('id-ID');
                html += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.nama}</td>
                        <td>Rp ${hargaFormat}</td>
                        <td>${item.stok} unit</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            html += `<p><strong>Total Produk:</strong> ${produkToko.length} item</p>`;
            return html;
        }

        // ============================================
        // DEMO PENGGUNAAN SISTEM
        // ============================================
        let output = document.getElementById('output');
        let htmlContent = "";

        // Demo 1: Tampilkan produk awal
        htmlContent += "<div class='section'>";
        htmlContent += "<h2> Daftar Produk Awal</h2>";
        htmlContent += tampilkanProduk();
        htmlContent += "</div>";

        // Demo 2: Tambah produk baru
        htmlContent += "<div class='section'>";
        htmlContent += "<h2>➕ Menambahkan Produk Baru</h2>";
        let pesan1 = tambahProduk("Monitor", 1500000, 8);
        htmlContent += `<p class="success">${pesan1}</p>`;
        let pesan2 = tambahProduk("Headset", 450000, 15);
        htmlContent += `<p class="success">${pesan2}</p>`;
        htmlContent += "<h3>Daftar Produk Setelah Penambahan:</h3>";
        htmlContent += tampilkanProduk();
        htmlContent += "</div>";

        // Demo 3: Hapus produk
        htmlContent += "<div class='section'>";
        htmlContent += "<h2>🗑️ Menghapus Produk</h2>";
        let pesanHapus = hapusProduk(2);
        htmlContent += `<p class="delete">${pesanHapus}</p>`;
        htmlContent += "<h3>Daftar Produk Setelah Penghapusan:</h3>";
        htmlContent += tampilkanProduk();
        htmlContent += "</div>";

        // Demo 4: Daftar produk final
        htmlContent += "<div class='section'>";
        htmlContent += "<h2>📊 Daftar Produk Final</h2>";
        htmlContent += tampilkanProduk();
        htmlContent += "</div>";

        output.innerHTML = htmlContent;

        // Menampilkan hasil di console browser
        console.log("=== SISTEM MANAJEMEN TOKO ONLINE ===");
        console.log("Produk akhir:", produkToko);
    </script>
</body>
</html>
