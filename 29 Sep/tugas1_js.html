<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 1 Javascript - Rumaisha (0110224087)</title>
</head>
<body>
    <h1>Perhitungan Luas Bangun Datar</h1>
    <hr>

    <script>
        // 1. FUNGSI MENGHITUNG LUAS PERSEGI PANJANG
        // Parameter: p (panjang), l (lebar)
        function hitungLuasPersegiPanjang(p, l) {
            // Menggunakan operator perkalian (*)
            return p * l; 
        }

        // 2. FUNGSI MENGHITUNG LUAS BUJUR SANGKAR
        // Parameter: s (sisi)
        function hitungLuasBujurSangkar(s) {
            // Menggunakan operator perkalian (*)
            return s * s; 
        }

        // 3. FUNGSI MENGHITUNG LUAS SEGITIGA
        // Parameter: a (alas), t (tinggi)
        function hitungLuasSegitiga(a, t) {
            // Menggunakan operator perkalian (*)
            return 0.5 * a * t; 
        }

        // DEKLARASI VARIABEL DENGAN NILAI BEBAS
        let panjangPP = 10;
        let lebarPP = 5;
        let sisiBS = 8;
        let alasSegitiga = 12;
        let tinggiSegitiga = 6;

        // Memanggil fungsi dan menyimpan hasilnya ke variabel baru
        let hasilPP = hitungLuasPersegiPanjang(panjangPP, lebarPP);
        let hasilBS = hitungLuasBujurSangkar(sisiBS);
        let hasilSegitiga = hitungLuasSegitiga(alasSegitiga, tinggiSegitiga);

        // MENAMPILKAN HASIL KE HALAMAN WEB
        document.write("<h3>Hasil Perhitungan:</h3>");
        
        // Menampilkan hasil Persegi Panjang
        document.write("<p>1. Luas Persegi Panjang (panjang: " + panjangPP + ", lebar: " + lebarPP + ") = <b>" + hasilPP + "</b></p>");
        
        // Menampilkan hasil Bujur Sangkar
        document.write("<p>2. Luas Bujur Sangkar (sisi: " + sisiBS + ") = <b>" + hasilBS + "</b></p>");
        
        // Menampilkan hasil Segitiga
        document.write("<p>3. Luas Segitiga (alas: " + alasSegitiga + ", tinggi: " + tinggiSegitiga + ") = <b>" + hasilSegitiga + "</b></p>");
    </script>
</body>
</html>
